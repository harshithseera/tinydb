# AutoSE: issue -> spec -> design -> code -> tests -> PR -> independent review.
# Architecture and decisions: see the submission repo (architecture/, ADR-001..010).
name: autose
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: autose-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    # ADR-010: label 'autose', or '/autose' from an OWNER/MEMBER/COLLABORATOR.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'autose') ||
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/autose') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      issue: ${{ steps.resolve.outputs.issue }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            ref=$(gh api "repos/$REPO/pulls/$NUM" --jq .head.ref)
            issue="${ref#autose/issue-}"
          else
            issue="$NUM"
          fi
          [[ "$issue" =~ ^[0-9]+$ ]] || { echo "not an autose issue/PR"; exit 1; }
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: master, path: ctl, persist-credentials: false }
      - uses: ./ctl/.github/actions/autose-setup
        with: { ref: master }
      - name: Stages 1-5 (pipeline.py)
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE: ${{ needs.gate.outputs.issue }}
        run: python ctl/autose_agent/pipeline.py --issue "$ISSUE" --from-stage 1 --round 1

  ci-1:
    needs: [gate, build]
    permissions:
      contents: read
    uses: ./.github/workflows/autose-ci.yml
    with:
      ref: autose/issue-${{ needs.gate.outputs.issue }}

  review-1:
    needs: [gate, ci-1]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: master, path: ctl, persist-credentials: false }
      - uses: ./ctl/.github/actions/autose-setup
        with: { ref: "autose/issue-${{ needs.gate.outputs.issue }}" }
      - id: review
        name: Independent review (review.py)
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE: ${{ needs.gate.outputs.issue }}
        run: python ctl/autose_agent/review.py --issue "$ISSUE" --round 1 --out "$RUNNER_TEMP/review"
      - uses: actions/upload-artifact@v4
        with: { name: review-1, path: "${{ runner.temp }}/review" }

  fix-1:
    needs: [gate, review-1]
    if: needs.review-1.outputs.verdict == 'changes-code' || needs.review-1.outputs.verdict == 'changes-approach'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: master, path: ctl, persist-credentials: false }
      - uses: ./ctl/.github/actions/autose-setup
        with: { ref: "autose/issue-${{ needs.gate.outputs.issue }}" }
      - uses: actions/download-artifact@v4
        with: { name: review-1, path: "${{ runner.temp }}/review" }
      - name: Return to design or implementation (pipeline.py)
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          VERDICT: ${{ needs.review-1.outputs.verdict }}
        run: |
          if [ "$VERDICT" = "changes-approach" ]; then from=2; else from=3; fi
          python ctl/autose_agent/pipeline.py --issue "$ISSUE" --from-stage "$from" --round 2 \
            --review-file "$RUNNER_TEMP/review/review-1.md"

  ci-2:
    needs: [gate, fix-1]
    permissions:
      contents: read
    uses: ./.github/workflows/autose-ci.yml
    with:
      ref: autose/issue-${{ needs.gate.outputs.issue }}

  review-2:
    needs: [gate, ci-2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: master, path: ctl, persist-credentials: false }
      - uses: ./ctl/.github/actions/autose-setup
        with: { ref: "autose/issue-${{ needs.gate.outputs.issue }}" }
      - id: review
        name: Independent review, final round (review.py)
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE: ${{ needs.gate.outputs.issue }}
        run: python ctl/autose_agent/review.py --issue "$ISSUE" --round 2 --final --out "$RUNNER_TEMP/review"
      - uses: actions/upload-artifact@v4
        with: { name: review-2, path: "${{ runner.temp }}/review" }
